<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N.I.K.I. - Главен архитект на светове</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Лява/Основна зона за чат -->
        <div class="main-chat-area" id="main-chat-area">
            <div class="chat-header">
                <div class="header-left">
                    <h1>N.I.K.I.</h1>
                    <div id="live-clock">00:00:00 ч.</div>
                </div>
                <div class="header-actions">
                    <span class="project-badge" id="current-ws-badge">Проект: GENERAL</span>
                    <button class="btn-fullscreen" onclick="toggleFullscreen()">⛶ Пълен екран</button>
                </div>
            </div>

            <div class="messages-container" id="messages-container">
                <div id="thinking-indicator">N.I.K.I. анализира параметрите и физичните закони... [ 1 ]</div>
            </div>

            <div class="input-container">
                <div class="quick-actions">
                    <button class="btn-quick" onclick="setQuickPrompt('Симулирай ефекта на пеперудата върху следния елемент: ')">🦋 Пеперуден ефект</button>
                    <button class="btn-quick" onclick="setQuickPrompt('Анализирай физичната и биологична достоверност на: ')">🔬 Физичен анализ</button>
                    <button class="btn-quick" onclick="setQuickPrompt('Запиши: ')">💾 Запиши факт</button>
                    <button class="btn-quick" onclick="setQuickPrompt('Изтрий всичко')">🗑️ Изчисти всичко</button>
                </div>
                <div class="input-wrapper">
                    <textarea id="chat-input" placeholder="Напишете инструкция или въпрос към N.I.K.I. (Enter за изпращане, Shift+Enter за нов ред)..."></textarea>
                    <button class="btn-send" onclick="sendMessage()">Изпрати</button>
                </div>
                <div class="auto-run-toggle">
                    <input type="checkbox" id="auto-run-checkbox">
                    <label for="auto-run-checkbox">Активиране на авто-симулация (Auto-Run цикъл)</label>
                </div>
            </div>
        </div>

        <!-- Дясна лента (Sidebar) за проекти, факти и библиотека -->
        <div class="sidebar">
            <!-- Управление на проекти -->
            <div class="sidebar-card">
                <div class="card-header">Проекти (Workspaces)</div>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <select id="workspace-select" class="form-control" onchange="changeWorkspace()"></select>
                    <button class="btn-sm btn-danger" onclick="deleteCurrentWorkspace()" title="Изтрий целия проект">🗑️</button>
                </div>
                <div style="display: flex; gap: 6px; margin-top: 6px;">
                    <input type="text" id="new-workspace-name" class="form-control" placeholder="Идеен свят...">
                    <button class="btn-sm btn-primary" onclick="createNewWorkspace()">Създай</button>
                </div>
            </div>

            <!-- Проверени факти -->
            <div class="sidebar-card">
                <div class="card-header">
                    <span>Проверени факти и закони</span>
                    <button id="btn-toggle-facts" class="btn-sm btn-secondary" onclick="toggleSection('btn-toggle-facts', 'fact-list-container')">[-]</button>
                </div>
                <div id="fact-list-container" style="display: flex; flex-direction: column;">
                    <ul class="fact-list" id="fact-list">
                        <li class="item-row" style="color:var(--text-muted);">Няма записани факти.</li>
                    </ul>
                </div>
            </div>

            <!-- Библиотека с файлове -->
            <div class="sidebar-card">
                <div class="card-header">
                    <span>Библиотека</span>
                    <span id="current-path" style="font-size:0.7rem; color:var(--text-muted);">/</span>
                </div>
                <div style="display: flex; gap: 6px;">
                    <button class="btn-sm btn-secondary" onclick="createNewFolder()">+ Нова папка</button>
                </div>
                <div style="display: flex; gap: 6px; align-items: center;">
                    <input type="file" id="file-upload-input" class="form-control" style="font-size: 0.75rem;">
                    <button class="btn-sm btn-success" onclick="uploadFile()">Качи</button>
                </div>
                <ul class="file-list" id="file-list">
                    <li class="item-row" style="color:var(--text-muted);">Папката е празна.</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
